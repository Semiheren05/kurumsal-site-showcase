<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" font-family="Segoe UI, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <rect width="960" height="560" fill="#ffffff"/>
  <defs>
    <marker id="ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
  </defs>

  <!-- Ziyaretci ve yonetici -->
  <rect x="40" y="40" width="190" height="64" rx="10" fill="#f4f5f7" stroke="#c9ccd3"/>
  <text x="135" y="68" text-anchor="middle" font-size="15" font-weight="600" fill="#1d1f24">Ziyaretçi</text>
  <text x="135" y="88" text-anchor="middle" font-size="12.5" fill="#5b5f68">tarayıcı / telefon</text>

  <rect x="40" y="130" width="190" height="64" rx="10" fill="#f4f5f7" stroke="#c9ccd3"/>
  <text x="135" y="158" text-anchor="middle" font-size="15" font-weight="600" fill="#1d1f24">Firma (panel)</text>
  <text x="135" y="178" text-anchor="middle" font-size="12.5" fill="#5b5f68">ADMIN / EDITOR rolleri</text>

  <!-- Caddy -->
  <rect x="300" y="78" width="170" height="78" rx="10" fill="#fff4f4" stroke="#e5484d"/>
  <text x="385" y="108" text-anchor="middle" font-size="15" font-weight="600" fill="#1d1f24">Caddy</text>
  <text x="385" y="128" text-anchor="middle" font-size="12.5" fill="#5b5f68">HTTPS, Let's Encrypt</text>
  <text x="385" y="145" text-anchor="middle" font-size="12.5" fill="#5b5f68">www → ana adres</text>

  <path d="M230,72 L298,105" stroke="#555" stroke-width="1.6" fill="none" marker-end="url(#ok)"/>
  <path d="M230,162 L298,130" stroke="#555" stroke-width="1.6" fill="none" marker-end="url(#ok)"/>

  <!-- Spring Boot uygulamasi -->
  <rect x="540" y="30" width="380" height="330" rx="12" fill="#f7f9ff" stroke="#3b6fd8"/>
  <text x="730" y="56" text-anchor="middle" font-size="15" font-weight="700" fill="#1d1f24">Spring Boot uygulaması (Java 21)</text>

  <rect x="560" y="72" width="165" height="62" rx="8" fill="#ffffff" stroke="#9fb6e8"/>
  <text x="642" y="98" text-anchor="middle" font-size="13.5" font-weight="600" fill="#1d1f24">Site sayfaları</text>
  <text x="642" y="117" text-anchor="middle" font-size="12" fill="#5b5f68">Spring MVC + Thymeleaf</text>

  <rect x="735" y="72" width="165" height="62" rx="8" fill="#ffffff" stroke="#9fb6e8"/>
  <text x="817" y="98" text-anchor="middle" font-size="13.5" font-weight="600" fill="#1d1f24">Yönetim API'si</text>
  <text x="817" y="117" text-anchor="middle" font-size="12" fill="#5b5f68">REST + JWT</text>

  <rect x="560" y="152" width="340" height="44" rx="8" fill="#ffffff" stroke="#9fb6e8"/>
  <text x="730" y="179" text-anchor="middle" font-size="13" fill="#1d1f24">Service katmanı · @Transactional · @Cacheable</text>

  <rect x="560" y="212" width="340" height="44" rx="8" fill="#ffffff" stroke="#9fb6e8"/>
  <text x="730" y="239" text-anchor="middle" font-size="13" fill="#1d1f24">Repository (Spring Data JPA) · Mapper · DTO</text>

  <rect x="560" y="272" width="165" height="68" rx="8" fill="#ffffff" stroke="#9fb6e8"/>
  <text x="642" y="300" text-anchor="middle" font-size="13" fill="#1d1f24">Flyway</text>
  <text x="642" y="319" text-anchor="middle" font-size="12" fill="#5b5f68">şema sürümleri</text>

  <rect x="735" y="272" width="165" height="68" rx="8" fill="#ffffff" stroke="#9fb6e8"/>
  <text x="817" y="300" text-anchor="middle" font-size="13" fill="#1d1f24">Güvenlik</text>
  <text x="817" y="319" text-anchor="middle" font-size="12" fill="#5b5f68">BCrypt · CSP · oran sınırı</text>

  <path d="M642,134 L642,150" stroke="#555" stroke-width="1.4" marker-end="url(#ok)"/>
  <path d="M817,134 L817,150" stroke="#555" stroke-width="1.4" marker-end="url(#ok)"/>
  <path d="M730,196 L730,210" stroke="#555" stroke-width="1.4" marker-end="url(#ok)"/>

  <path d="M470,117 L538,117" stroke="#555" stroke-width="1.6" fill="none" marker-end="url(#ok)"/>

  <!-- PostgreSQL ve dosyalar -->
  <rect x="560" y="410" width="165" height="70" rx="10" fill="#f2fbf5" stroke="#2f9e60"/>
  <text x="642" y="440" text-anchor="middle" font-size="15" font-weight="600" fill="#1d1f24">PostgreSQL 17</text>
  <text x="642" y="460" text-anchor="middle" font-size="12.5" fill="#5b5f68">içerik, ayarlar, formlar</text>

  <rect x="735" y="410" width="165" height="70" rx="10" fill="#f2fbf5" stroke="#2f9e60"/>
  <text x="817" y="440" text-anchor="middle" font-size="15" font-weight="600" fill="#1d1f24">Dosya deposu</text>
  <text x="817" y="460" text-anchor="middle" font-size="12.5" fill="#5b5f68">görseller, PDF, CV</text>

  <path d="M642,360 L642,408" stroke="#555" stroke-width="1.6" marker-end="url(#ok)"/>
  <path d="M817,360 L817,408" stroke="#555" stroke-width="1.6" marker-end="url(#ok)"/>

  <!-- Yedek -->
  <rect x="300" y="410" width="190" height="70" rx="10" fill="#fffaf0" stroke="#d9a02b"/>
  <text x="395" y="440" text-anchor="middle" font-size="15" font-weight="600" fill="#1d1f24">Gece yedeği</text>
  <text x="395" y="460" text-anchor="middle" font-size="12.5" fill="#5b5f68">veritabanı + dosyalar, 14 gün</text>
  <path d="M558,445 L492,445" stroke="#555" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ok)"/>

  <text x="40" y="530" font-size="12.5" fill="#5b5f68">Hepsi Docker Compose ile tek bir VPS üzerinde çalışır: app, postgres, caddy, backup.</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
